services:
  - type: web
    name: mehfooze-api
    env: python
    plan: free
    buildCommand: pip install -r app/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: mehfooze-db
          property: connectionString
      - key: AQICN_TOKEN
        # Optional — adds live AQICN station cross-check.
        # Set this secret in the Render dashboard (Environment tab).
        # Leave unset to use Open-Meteo CAMS as sole source (still 100% real data).
        # Free token: https://aqicn.org/data-platform/token/
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /health

databases:
  - name: mehfooze-db
    plan: free
    databaseName: mehfooze
